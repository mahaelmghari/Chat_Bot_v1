<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">   
<title>Chat bot v1</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/src/templates/static/style.css" type="text/css">
</head>

<body>
    <div id="body">
        <div id="title">
            Chat Bot v1
        </div>
        <div id="input">
            <form action="/a/message/new" method="post" id="messageform">
                <div class="form-group input-container">
                    <input class="form-control" type="text" name="body" id="message-input" placeholder="Type your message here..." required>
                    <button type="submit" class="btn btn-info">Send</button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="/src/templates/static/script.js" type="text/javascript"></script>
</body>
