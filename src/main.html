<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">   
<title>Chat bot v1</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
    <div class= "chat-square">
        <div class="chat-header">
            <div class = "avatar"></div>
            <div class = "class-info"></div>
            <div class = "header-name">Chat</div>
            <div class = "header-status"><span class = "dot"></span> Thinking...</div>
        </div>

        <div class = "chat-body" id = "chatBody">
            <div class = "message bot-message">Hello! How may I help you?</div>
            <div class = "message user-message">Hello! Can you...</div>
        </div>

        <div class = "chat-input">
            <input type = "text" id = "userInput" placeholder = "Type your question ...">
            <button class = "send-Button" id = "sendButton" onclick = "sendMsg()">Send</button>
        </div>
    </div>

</body
